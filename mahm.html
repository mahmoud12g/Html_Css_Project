<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Snaker_Project</title>
        <link rel="stylesheet" href="mahm.css">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>
    <body>
        <main class="conntanir">
            <header class="nav">
                <div class="nav-left">
                    <a href="#"><strong>Sneaker</strong></a>
                    <ul class="nav-links">
                        <li><a href="#">Collections</a></li>
                        <li><a href="#">Men</a></li>
                        <li><a href="#">Women</a></li>
                        <li><a href="#">About</a></li>
                        <li><a href="#">Contact</a></li>
                    </ul>
                </div>
                <div class="nav-right">
                    <button class="cart">
                        <i class="fa-solid fa-cart-shopping"></i>
                    </button>
                    <img src="./img/Snapchat-1082085922.jpg" alt="Logo"
                        class="logo">
                </div>
            </header>
            <div class="main">
                <div class="photos">
                    <div class="photo1">
                        <img src="./img/images (8).jpg" alt>
                    </div>
                    <div class="photo2">
                        <img class="img1" src="./img/images (5).jpg" alt>
                        <img class="img2" src="./img/images (7).jpg" alt>
                        <img class="img3" src="./img/images (9).jpg" alt>
                    </div>
                </div>
                <div class="sales">
                    <h3>SNEAKER COMPANY</h3>
                    <h1>Fall Limited Edition<br>Sneakers</h1>
                    <p class="disc1">These low-profile sneakers are your perfect
                        casual wear
                        companion. Featuring a durable rubber
                        outer sole, they’ll withstand everything the weather can
                        offer.</p>
                    <div class="price">
                        <h2>$125.00</h2>
                        <p class="disc2">50%</p>
                    </div>
                    <p class="disc3">$250.00</p>
                    <div class="buttuon">
                        <div class="but1">
                            <button class="minus">
                                <i class="fa-solid fa-minus"></i>
                            </button>
                            <p class="num">0</p>
                            <button class="plus">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                        <div class="butt2">
                            <button class="add"><i class="fa-solid fa-cart-shopping"></i> Add to Cart</button>
                        </div>
    
                    </div>
                </div>
            </div>
            </main>
        </body>
    </html>
